services:
  subscription:
    build:
      context: ./subscribe
      dockerfile: ./cmd/Dockerfile
    ports:
      - "8081:8080"
      - "9090:9090"
    environment:
      GRPC_ADDR: ":9090"
    networks:
      - tc-news
    depends_on:
      subscribe-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  subscribe-db:
    image: "postgres:16"
    ports:
      - "5432:5432"
    networks:
      - tc-news
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  comment:
    build:
      context: ./comment
      dockerfile: ./Dockerfile
    ports:
      - "8084:8080"
    networks:
      - tc-news
    environment:
      POST_SERVICE_URL: "http://post:8080"
    depends_on:
      comment-db:
        condition: service_healthy
      kafka-service:
        condition: service_healthy
      post:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').createConnection(8080,'localhost').on('connect',function(){process.exit(0)}).on('error',function(){process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  comment-db:
    networks:
      - tc-news
    image: "postgres:16"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification:
    build:
      context: ./notification
      dockerfile: ./cmd/Dockerfile
    ports:
      - "8086:8080"
    networks:
      - tc-news
    environment:
      SUBSCRIBE_GRPC_ADDR: "subscription:9090"
      SUBSCRIBE_HTTP_ADDR: "http://subscription:8080"
    depends_on:
      notification-db:
        condition: service_healthy
      kafka-service:
        condition: service_healthy
      subscription:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  notification-db:
    image: "postgres:16"
    networks:
      - tc-news
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  vote:
    build:
      context: ./vote
      dockerfile: ./cmd/Dockerfile
    ports:
      - "8082:8080"
    networks:
      - tc-news
    depends_on:
      vote-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  vote-db:
    image: "postgres:16"
    networks:
      - tc-news
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  post:
    build:
      context: ./post
      dockerfile: ./cmd/Dockerfile
    ports:
      - "8083:8080"
    networks:
      - tc-news
    depends_on:
      post-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  post-db:
    image: "postgres:16"
    networks:
      - tc-news
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # NOTE: this service was defined in event/ (Dockerfile, docs, kafka consumer,
  # store) but was missing from docker-compose.yaml entirely. It consumes the
  # "events" Kafka topic (see event/cmd/main.go) and serves GET /events on
  # :8080, so it needs its own Postgres and a place in the Kafka dependency
  # chain, same shape as notification/comment.
  event:
    build:
      context: ./event
      dockerfile: ./cmd/Dockerfile
    ports:
      - "8087:8080"
    networks:
      - tc-news
    environment:
      DB_HOST: "event-db"
      KAFKA_ADDR: "kafka-service:9092"
    depends_on:
      event-db:
        condition: service_healthy
      kafka-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  event-db:
    image: "postgres:16"
    networks:
      - tc-news
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    build:
      context: ./auth
      dockerfile: ./cmd/Dockerfile
    networks:
      - tc-news
    ports:
      - "8085:8080"
    environment:
      USER_DB_HOST: "auth-postgres-db"
      SESSION_DB_HOST: "auth-db"
    depends_on:
      auth-db:
        condition: service_healthy
      auth-postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  auth-db:
    image: "redis"
    networks:
      - tc-news
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  auth-postgres-db:
    image: "postgres:16"
    networks:
      - tc-news
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka-service:
    image: apache/kafka:latest
    networks:
      - tc-news
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-service:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-service:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

networks:
  tc-news:
